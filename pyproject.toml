[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "prguard"
version = "0.1.0"
description = "Git diff risk analyzer, secret-leak scanner, and automated PR review summary CLI."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Anwin CM", email = "Anwincm8@gmail.com" }]
keywords = ["git", "pull-request", "security", "static-analysis", "ci-cd", "cli"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
prguard = "prguard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
