name: PRGuard CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - run: pytest -v
      - if: github.event_name == 'pull_request'
        run: prguard scan --base origin/${{ github.base_ref }} --require-tests --fail-on-high --markdown
